<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="300" viewBox="0 0 1000 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Anilix — stream anime from your terminal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a13"/>
      <stop offset="0.55" stop-color="#0c1222"/>
      <stop offset="1" stop-color="#131a31"/>
    </linearGradient>

    <linearGradient id="tg" gradientUnits="userSpaceOnUse" x1="290" y1="150" x2="710" y2="150">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="0.35" stop-color="#6366f1"/>
      <stop offset="0.7" stop-color="#d946ef"/>
      <stop offset="1" stop-color="#f43f5e"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 140 0; 0 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="shimmer" gradientUnits="userSpaceOnUse" x1="250" y1="0" x2="750" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-700 0; 700 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="waveGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#d946ef" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#f43f5e" stop-opacity="0.6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; -500 0; 0 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="round">
      <rect width="1000" height="300" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="300" fill="url(#bg)"/>

    <!-- twinkling stars -->
    <circle cx="110" cy="58" r="1.6" fill="#7dd3fc"><animate attributeName="opacity" values="0.15;1;0.15" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="215" cy="118" r="1.2" fill="#e879f9"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="4.2s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="52" r="1.4" fill="#a5b4fc"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="96" r="1.1" fill="#fda4af"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.6s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="48" r="1.6" fill="#7dd3fc"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.3s" begin="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="745" cy="112" r="1.3" fill="#e879f9"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.9s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="870" cy="60" r="1.5" fill="#a5b4fc"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.8s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="925" cy="150" r="1.1" fill="#fda4af"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.1s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="170" r="1.3" fill="#a5b4fc"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="4s" begin="2s" repeatCount="indefinite"/></circle>

    <!-- glowing animated title -->
    <g filter="url(#glow)">
      <text x="500" y="150" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="92" font-weight="800" letter-spacing="28" fill="url(#tg)">ANILIX</text>
    </g>
    <text x="500" y="150" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="92" font-weight="800" letter-spacing="28" fill="url(#shimmer)">ANILIX</text>

    <!-- tagline -->
    <text x="500" y="198" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" letter-spacing="5" fill="#9aa3b8">STREAM ANIME &#183; FROM YOUR TERMINAL</text>

    <!-- shimmering underline -->
    <rect x="370" y="214" width="260" height="2" rx="1" fill="url(#waveGrad)"/>

    <!-- animated wave -->
    <g opacity="0.5">
      <path fill="url(#waveGrad)" d="M0 262 Q 62.5 242 125 262 T 250 262 T 375 262 T 500 262 T 625 262 T 750 262 T 875 262 T 1000 262 T 1125 262 T 1250 262 T 1375 262 T 1500 262 V 300 H 0 Z">
        <animateTransform attributeName="transform" type="translate" values="0 0; -250 0" dur="5s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
